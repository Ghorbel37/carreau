name: Rebuild release

# Rebuild the APK of an earlier commit and publish it as release v1.1.<build>,
# e.g. to replace the old build-N releases. It becomes the "latest" release only when asked.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build
        required: true
      build:
        description: Build number (the release becomes v1.1.<build>, versionCode <build>)
        required: true
      latest:
        description: Mark it as the latest release
        type: boolean
        default: false
      replaces:
        description: Old release (tag) to delete once this one is published, e.g. build-2
        required: false
        default: ''

jobs:
  rebuild:
    name: Rebuild v1.1.${{ inputs.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: 1.1.${{ inputs.build }}
      CARREAU_BUILD: ${{ inputs.build }}
    steps:
      # The release tag must already exist on the commit (GitHub doesn't let workflows tag older commits
      # whose workflow files differ from today's), so push it first: git tag v1.1.N <commit> && git push origin v1.1.N
      - name: Check the tag
        run: |
          sha=$(git ls-remote https://github.com/${{ github.repository }} "refs/tags/v$VERSION" | cut -f1)
          [ -n "$sha" ] || { echo "Push tag v$VERSION on ${{ inputs.ref }} first"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Today's tools (release notes) from main, with full history to read the commit message.
      - uses: actions/checkout@v7
        with:
          ref: main
          path: .tools
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Use the requested build number for the version
        run: |
          # Older commits read the version from CI's run number; point them at the requested one.
          sed -i 's/System.getenv("GITHUB_RUN_NUMBER")/System.getenv("CARREAU_BUILD")/' android/app/build.gradle
          grep -q CARREAU_BUILD android/app/build.gradle
          if [ -f www/version.js ]; then echo "window.CARREAU_VERSION = '$VERSION';" > www/version.js; fi
      - name: Copy the web game into the Android project
        run: |
          # Newer commits build the app version into dist/app first.
          if [ -f scripts/build.js ]; then node scripts/build.js app; fi
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt" dump badging "$apk" | grep -q "versionName='$VERSION'" || { echo "APK version is not $VERSION"; exit 1; }
          "$(dirname "$aapt")/apksigner" verify --print-certs "$apk" | grep "Carreau test build"
          cp "$apk" "carreau-v$VERSION.apk"
      - name: Write the release notes
        run: |
          (cd .tools && bash .github/release-notes.sh "$VERSION" "${{ inputs.ref }}" ${{ inputs.latest && 'latest' || '' }})
          mv .tools/release-notes.md .
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Carreau v${{ env.VERSION }}
          make_latest: ${{ inputs.latest }}
          files: carreau-v${{ env.VERSION }}.apk
          body_path: release-notes.md
      - name: Remove the release it replaces
        if: inputs.replaces != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.replaces }}" --repo "${{ github.repository }}" --yes
