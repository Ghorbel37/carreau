name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (phone + desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Copy the web game into the Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK
        env:
          VERSION: 1.1.${{ github.run_number }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt" dump badging "$apk" | grep -E "package:|application-label:|sdkVersion"
          "$aapt" dump badging "$apk" | grep -q "versionName='$VERSION'" || { echo "APK version is not $VERSION"; exit 1; }
          "$(dirname "$aapt")/apksigner" verify --print-certs "$apk" | grep "Carreau test build"
          cp "$apk" carreau.apk
          cp "$apk" "carreau-v$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: carreau-v1.1.${{ github.run_number }}
          path: carreau-v1.1.${{ github.run_number }}.apk
          retention-days: 30
      - name: Publish as the latest release (one-tap download on the phone)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Carreau v1.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          # A versioned copy, plus carreau.apk so the "latest" download link never changes.
          files: |
            carreau-v1.1.${{ github.run_number }}.apk
            carreau.apk
          body: |
            **Version 1.1.${{ github.run_number }}** (Android versionCode ${{ github.run_number }}), built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            Install on Android: download `carreau.apk` on the phone, open it, and allow installs from this source when asked.
            New builds install over this one and keep your progress.
