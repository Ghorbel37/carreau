name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.1.${{ github.run_number }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (phone + desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Stamp the version
        run: echo "window.CARREAU_VERSION = '$VERSION';" > www/version.js
      - name: Copy the web game into the Android project
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt" dump badging "$apk" | grep -E "package:|application-label:|sdkVersion"
          "$aapt" dump badging "$apk" | grep -q "versionName='$VERSION'" || { echo "APK version is not $VERSION"; exit 1; }
          "$(dirname "$aapt")/apksigner" verify --print-certs "$apk" | grep "Carreau test build"
          cp "$apk" carreau.apk
          cp "$apk" "carreau-v$VERSION.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: carreau-v${{ env.VERSION }}
          path: carreau-v${{ env.VERSION }}.apk
          retention-days: 30
      - name: Write the release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/release-notes.sh "$VERSION" "${{ github.sha }}" latest
      - name: Publish as the latest release (one-tap download on the phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Carreau v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          # A versioned copy, plus carreau.apk so the "latest" download link never changes.
          files: |
            carreau-v${{ env.VERSION }}.apk
            carreau.apk
          body_path: release-notes.md

  pages:
    name: Web version (GitHub Pages)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the version
        run: |
          echo "window.CARREAU_VERSION = '$VERSION';" > www/version.js
          # A new offline-cache name per build, so phones pick up the new version.
          sed -i "s/const CACHE = '[^']*'/const CACHE = 'carreau-$VERSION'/" www/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v5
