name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.1.${{ github.run_number }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (phone + desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_UPLOAD_KEY: ${{ secrets.CARREAU_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Build the app version and copy it into the Android project
        run: |
          node scripts/build.js app
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          aapt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$aapt" dump badging "$apk" | grep -E "package:|application-label:|sdkVersion"
          "$aapt" dump badging "$apk" | grep -q "versionName='$VERSION'" || { echo "APK version is not $VERSION"; exit 1; }
          "$(dirname "$aapt")/apksigner" verify --print-certs "$apk" | grep "Carreau test build"
          cp "$apk" "carreau-v$VERSION.apk"
      # Play Store bundle, signed with your private upload key once its secrets exist (docs/PLAY_STORE.md).
      - name: Build the Play Store bundle (AAB)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          CARREAU_UPLOAD_STORE_PASSWORD: ${{ secrets.CARREAU_UPLOAD_STORE_PASSWORD }}
          CARREAU_UPLOAD_KEY_ALIAS: ${{ secrets.CARREAU_UPLOAD_KEY_ALIAS }}
          CARREAU_UPLOAD_KEY_PASSWORD: ${{ secrets.CARREAU_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.CARREAU_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          export CARREAU_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.keystore"
          (cd android && ./gradlew bundleRelease --no-daemon)
          cp android/app/build/outputs/bundle/release/app-release.aab "carreau-play-v$VERSION.aab"
          rm "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v7
        if: hashFiles('carreau-play-*.aab') != ''
        with:
          name: carreau-play-v${{ env.VERSION }}
          path: carreau-play-v${{ env.VERSION }}.aab
          retention-days: 90
      - uses: actions/upload-artifact@v7
        with:
          name: carreau-v${{ env.VERSION }}
          path: carreau-v${{ env.VERSION }}.apk
          retention-days: 30
      - name: Write the release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash .github/release-notes.sh "$VERSION" "${{ github.sha }}" latest
      - name: Publish as the latest release (one-tap download on the phone)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Carreau v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: carreau-v${{ env.VERSION }}.apk
          body_path: release-notes.md

  pages:
    name: Web version (GitHub Pages)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the web version
        run: node scripts/build.js web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v5

  store:
    name: Play Store listing (screenshots)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Take the phone screenshots of the app version
        run: |
          node scripts/build.js app
          ROOT=dist/app node scripts/serve.js &
          sleep 1
          node scripts/store-screenshots.js
      - uses: actions/upload-artifact@v7
        with:
          name: play-store-listing-v${{ env.VERSION }}
          path: fastlane/metadata/android
          retention-days: 90
