<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carreau</title>
<meta name="theme-color" content="#f3f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a2c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width=".22" height=".22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2=".22"/></pattern>
    <pattern id="hatchWin" width=".16" height=".16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2=".16"/></pattern>
    <pattern id="hatchMiss" width=".22" height=".22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2=".22"/></pattern>
  </defs>
</svg>
<div class="app">
  <header>
    <h1>Carr<span>eau</span></h1>
    <div class="toggles">
      <button class="tog" id="soundBtn" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
          <path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <button class="tog" id="musicBtn" aria-pressed="true" aria-label="Music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 17.5V5.5l10-2v12"/>
          <circle cx="6.5" cy="17.5" r="2.5" fill="currentColor"/>
          <circle cx="16.5" cy="15.5" r="2.5" fill="currentColor"/>
          <path class="off" d="M3.5 3.5l17 17"/>
        </svg>
      </button>
      <button class="tog" id="vibeBtn" aria-pressed="true" aria-label="Vibration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="3.5" width="8" height="17" rx="1.8"/>
          <path class="on" d="M4.5 8.5v7M2 10.5v3M19.5 8.5v7M22 10.5v3"/>
          <path class="off" d="M3.5 3.5l17 17"/>
        </svg>
      </button>
      <button class="tog" id="statsBtn" aria-label="Stats and achievements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 4h8v5a4 4 0 0 1-8 0z"/>
          <path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="panel">
    <div class="stack" id="home">
      <div class="worlds" role="group" aria-label="World">
        <button class="world" data-world="tri"><span class="txt"><b>Triangle</b><em></em></span></button>
        <button class="world" data-world="square"><span class="txt"><b>Carreau</b><em></em></span></button>
        <button class="world" data-world="hex"><span class="txt"><b>Ruche</b><em></em></span></button>
      </div>
      <div class="modes">
        <button class="mode hero" data-mode="gates"><b>Gates</b><span>Walls fly at you. Reshape to fit the holes before they hit.</span><em id="bestGates"></em></button>
        <button class="mode" data-mode="daily"><b>Daily</b><span id="dailyWorld"></span><em id="bestDaily"></em></button>
        <button class="mode" data-mode="precision"><b>Precision</b><span>Slower walls. A wasted swipe costs a life.</span><em id="bestPrecision"></em></button>
        <button class="mode" data-mode="rush"><b>Rush</b><span>Match shapes against a 60 s clock.</span><em id="bestRush"></em></button>
        <button class="mode" data-mode="zen"><b>Zen</b><span>No clock. Just shapes.</span><em id="bestZen"></em></button>
      </div>
      <div class="line"><span class="muted" id="worldBlurb"></span><button class="link" id="howTo">How to play</button></div>
    </div>

    <div class="hud" id="hud" hidden>
      <div class="targets" id="targets"></div>
      <div class="stats">
        <div class="nums">
          <div><span class="label" id="l0"></span><b id="v0"></b></div>
          <div><span class="label" id="l1"></span><b id="v1"></b></div>
          <div><span class="label" id="l2"></span><b id="v2"></b></div>
        </div>
        <div class="bar" id="bar"><i id="barfill"></i></div>
        <div class="items" id="items">
          <button class="chip" id="item-slow" aria-label="Use slow motion">Slow <b>0</b></button>
          <button class="chip" id="item-shield" aria-label="Shields (used automatically)">Shield <b>0</b></button>
          <button class="chip" id="item-skip" aria-label="Skip this wall">Skip <b>0</b></button>
        </div>
        <div class="line"><span id="line"></span><span class="links"><button class="link" id="pause">Pause</button><button class="link" id="quit">Quit</button></span></div>
      </div>
    </div>

    <div class="stack" id="tut" hidden>
      <p id="tutText"></p>
      <div class="line"><span id="tutStep" class="muted"></span><button class="link" id="tutSkip">Skip tutorial</button></div>
    </div>

    <div class="stack" id="paused" hidden>
      <p><strong>Paused.</strong> The clock is stopped.</p>
      <div class="row"><button class="go" id="resume">Resume</button><button class="ghost" id="pausedQuit">Quit</button></div>
    </div>

    <div class="stack" id="result" hidden>
      <p><strong id="resTitle"></strong></p>
      <div class="stars" id="resStars" hidden></div>
      <p id="resText"></p>
      <ul class="extra" id="resExtra"></ul>
      <div class="row"><button class="go" id="resMain"></button><button class="ghost" id="resAlt"></button></div>
    </div>

    <div class="stack" id="stats" hidden>
      <div class="head"><strong>Stats</strong><button class="link" data-home>Back</button></div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="head"><strong>Achievements</strong><span class="muted" id="achCount"></span></div>
      <ul class="ach" id="achList"></ul>
      <p class="muted" id="version"></p>
    </div>
  </section>

  <main class="stage" id="stage">
    <svg class="board" id="board" role="group" aria-label="Board"></svg>
    <div id="flash"></div>
  </main>
  <p class="hint" id="hint"></p>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script src="version.js"></script>
<script src="core.js"></script>
<script src="board.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
