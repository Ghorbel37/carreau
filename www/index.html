<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carreau</title>
<meta name="theme-color" content="#f3f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a2c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-screen notebook page — header, a panel (modes / levels / target / results), then the board framed by its four edge arrows. */
:root {
  --paper: #f3f6f9;      /* squared notebook paper */
  --rule: #cfdbea;       /* faint blue lines */
  --margin: #d4605a;     /* red margin line, also used for misses */
  --ink: #22306a;        /* blue-black pen */
  --ink-soft: #5d6a94;
  --green: #17845a;      /* the green pen from the signatures — success */
  --card: rgba(255,255,255,.72);
  --display: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a2c; --rule: #222d47; --margin: #e0716b; --ink: #e2e8ff; --ink-soft: #9aa6cc;
    --green: #4fd08d; --card: rgba(24,32,54,.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a2c; --rule: #222d47; --margin: #e0716b; --ink: #e2e8ff; --ink-soft: #9aa6cc;
  --green: #4fd08d; --card: rgba(24,32,54,.8); color-scheme: dark;
}

html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 10px, var(--margin) 10px, var(--margin) 11.5px, transparent 11.5px),
    repeating-linear-gradient(180deg, transparent 0 27px, var(--rule) 27px 28px);
  color: var(--ink);
  font: 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  overflow: hidden;
}
.app {
  height: 100%;
  box-sizing: border-box;
  max-width: 520px;
  margin: 0 auto;
  padding-inline: 20px 16px;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font: 700 2.3rem/1 var(--display); margin: 0; letter-spacing: .01em; }
h1 span { color: var(--green); }
.toggles { display: flex; gap: 8px; }
.tog {
  width: 40px; height: 40px; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  border: 2px solid var(--ink); border-radius: 9px 12px 8px 11px;
  background: var(--card); color: var(--ink);
  transition: color .2s, border-color .2s, transform .15s;
}
.tog svg { width: 22px; height: 22px; }
.tog:active { transform: scale(.92); }
.tog[aria-pressed="false"] { color: var(--ink-soft); border-color: var(--ink-soft); border-style: dashed; }
.tog[aria-pressed="false"] .on, .tog[aria-pressed="true"] .off { display: none; }

/* Panel */
.panel {
  background: var(--card);
  border: 2px solid var(--ink);
  border-radius: 6px 10px 7px 12px;
  padding: 12px 14px;
  box-sizing: border-box;
}
.screen { animation: enter .25s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack p { margin: 0; font-size: .92rem; max-width: 60ch; }
.stack p strong { font-family: var(--display); font-size: 1.15rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--ink-soft); font-size: .85rem; }

button { font: inherit; }
button:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
.go, .ghost {
  font: 700 1.2rem/1 var(--display);
  border: 2px solid var(--ink); border-radius: 8px 12px 9px 13px;
  padding: 9px 20px 7px; cursor: pointer;
  transition: transform .15s;
}
.go { color: var(--paper); background: var(--ink); }
.ghost { color: var(--ink); background: transparent; }
.go:active, .ghost:active { transform: scale(.96); }

.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mode {
  text-align: left; cursor: pointer; color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--ink); border-radius: 7px 11px 8px 12px;
  padding: 8px 10px; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
  transition: transform .15s;
}
.mode:active { transform: scale(.97); }
.mode b { font: 700 1.3rem/1.1 var(--display); }
.mode span { font-size: .78rem; color: var(--ink-soft); line-height: 1.25; }
.mode em { font-style: normal; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--green); font-variant-numeric: tabular-nums; }

.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.head strong { font: 700 1.3rem/1 var(--display); }
.link { background: none; border: 0; color: var(--ink-soft); font-size: .88rem; text-decoration: underline; cursor: pointer; padding: 4px; }
.lvl-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.lvl {
  aspect-ratio: 1.15; max-width: 100%; padding: 0; cursor: pointer;
  border: 2px solid var(--ink); border-radius: 6px 9px 7px 8px;
  background: var(--paper); color: var(--ink);
  font: 700 1.1rem/1 var(--display);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.lvl small { font: 400 .62rem/1 var(--body); color: var(--green); letter-spacing: .04em; min-height: .62rem; }
.lvl:disabled { border-style: dashed; color: var(--ink-soft); border-color: var(--ink-soft); cursor: default; opacity: .7; }

.hud { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.targets { display: flex; gap: 6px; align-items: center; }
.stats { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.nums { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.nums div { display: flex; flex-direction: column; min-width: 0; }
.nums b { font: 700 1.6rem/1 var(--display); display: inline-block; transform-origin: left bottom; white-space: nowrap; }
.nums b.bump { animation: bump .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes bump { 40% { transform: scale(1.35); color: var(--green); } }
.label { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); }
.bar { height: 10px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; transition: background .3s; }
.bar.low i { background: var(--margin); }
.line { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.line span { font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stars { font: 700 2rem/1 var(--display); color: var(--green); letter-spacing: .1em; }
.stars .dim { color: var(--rule); }

/* Board */
.stage {
  flex: 1; min-height: 0;
  display: grid; place-items: center;
  touch-action: none;
  container-type: size;
}
.frame {
  --size: min(calc(100vw - 132px), calc(100dvh - 330px), 400px);
  display: grid;
  grid-template-columns: 44px var(--size) 44px;
  grid-template-rows: 44px var(--size) 44px;
  gap: 4px;
}
@supports (container-type: size) {
  .frame { --size: max(120px, min(calc(100cqw - 100px), calc(100cqh - 100px), 420px)); }
}
.edge {
  background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0;
  display: grid; place-items: center; border-radius: 10px;
}
.edge svg { width: 36px; height: 22px; transition: transform .2s; }
.edge.v svg { transform: rotate(90deg); }
.edge.fire { animation: fire .35s ease-out; }
@keyframes fire { 0% { background: color-mix(in srgb, var(--green) 28%, transparent); } 100% { background: transparent; } }
.edge.top { grid-area: 1 / 2; } .edge.bottom { grid-area: 3 / 2; }
.edge.left { grid-area: 2 / 1; } .edge.right { grid-area: 2 / 3; }

.board {
  grid-area: 2 / 2;
  position: relative;
  border: 3px solid var(--ink);
  border-radius: 3px 5px 2px 6px;
  background: color-mix(in srgb, var(--paper) 85%, transparent);
  box-sizing: border-box;
}
.board.pop { animation: pop .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes pop { 35% { transform: scale(1.045) rotate(-.6deg); } }
.board.shake { animation: shake .42s ease-in-out; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.piece {
  position: absolute;
  box-sizing: border-box;
  border: 2.5px solid var(--ink);
  border-radius: 2px 4px 3px 2px;
  background: repeating-linear-gradient(135deg, var(--ink) 0 1.5px, transparent 1.5px 9px);
  transition:
    width .26s cubic-bezier(.34,1.56,.64,1),
    height .26s cubic-bezier(.34,1.56,.64,1),
    border-color .2s, opacity .2s;
}
.piece.tl { left: -1.5px; top: -1.5px; } .piece.tr { right: -1.5px; top: -1.5px; }
.piece.bl { left: -1.5px; bottom: -1.5px; } .piece.br { right: -1.5px; bottom: -1.5px; }
.board.win .piece { border-color: var(--green); background: repeating-linear-gradient(135deg, var(--green) 0 2px, transparent 2px 7px); }
.board.miss .piece { border-color: var(--margin); background: repeating-linear-gradient(135deg, var(--margin) 0 1.5px, transparent 1.5px 9px); }

.board.mini { width: 74px; height: 74px; border-width: 2px; }
.board.mini.sm { width: 50px; height: 50px; }
.mini .piece { border-width: 1.5px; background: repeating-linear-gradient(135deg, var(--ink) 0 1px, transparent 1px 5px); }
.mini.sm.cur { box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 45%, transparent); }
.mini.done { opacity: .4; }
.mini.enter { animation: tin .34s cubic-bezier(.34,1.56,.64,1); }
@keyframes tin { from { transform: scale(.55) rotate(-8deg); opacity: 0; } }
.mini.veil .piece { opacity: 0; }
.mini.veil::after {
  content: "?"; position: absolute; inset: 0;
  display: grid; place-items: center;
  font: 700 2.2rem/1 var(--display); color: var(--ink-soft);
}

.hint { text-align: center; font: 400 1.05rem/1.2 var(--display); color: var(--ink-soft); margin: 0; min-height: 1.3em; }
.hint.say { color: var(--green); animation: say .45s cubic-bezier(.34,1.56,.64,1); }
.hint.bad { color: var(--margin); }
@keyframes say { from { transform: scale(.7); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .piece { transition: border-color .2s; }
  .edge.fire, .board.pop, .board.shake, .mini.enter, .hint.say, .nums b.bump, .screen { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Carr<span>eau</span></h1>
    <div class="toggles">
      <button class="tog" id="soundBtn" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
          <path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <button class="tog" id="vibeBtn" aria-pressed="true" aria-label="Vibration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="3.5" width="8" height="17" rx="1.8"/>
          <path class="on" d="M4.5 8.5v7M2 10.5v3M19.5 8.5v7M22 10.5v3"/>
          <path class="off" d="M3.5 3.5l17 17"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="panel">
    <div class="stack" id="home">
      <div class="modes">
        <button class="mode" data-mode="rush"><b>Rush</b><span>Match as many as you can in 60 s.</span><em id="bestRush"></em></button>
        <button class="mode" data-mode="levels"><b>Levels</b><span>30 puzzles with a move limit.</span><em id="bestLevels"></em></button>
        <button class="mode" data-mode="memory"><b>Memory</b><span>See it, it hides, rebuild it.</span><em id="bestMemory"></em></button>
        <button class="mode" data-mode="zen"><b>Zen</b><span>No clock. Just shapes.</span><em id="bestZen"></em></button>
      </div>
      <p class="muted">Swipe ⇄ in the top or bottom half to change the width of that pair, ⇅ in the left or right half to change the height.</p>
    </div>

    <div class="stack" id="levels" hidden>
      <div class="head"><strong>Levels</strong><span class="muted" id="starTotal"></span><button class="link" data-home>Back</button></div>
      <div class="lvl-grid" id="lvlGrid"></div>
    </div>

    <div class="hud" id="hud" hidden>
      <div class="targets" id="targets"></div>
      <div class="stats">
        <div class="nums">
          <div><span class="label" id="l0"></span><b id="v0"></b></div>
          <div><span class="label" id="l1"></span><b id="v1"></b></div>
          <div><span class="label" id="l2"></span><b id="v2"></b></div>
        </div>
        <div class="bar" id="bar"><i id="barfill"></i></div>
        <div class="line"><span id="line"></span><button class="link" id="quit">Quit</button></div>
      </div>
    </div>

    <div class="stack" id="result" hidden>
      <p><strong id="resTitle"></strong></p>
      <div class="stars" id="resStars" hidden></div>
      <p id="resText"></p>
      <div class="row"><button class="go" id="resMain"></button><button class="ghost" id="resAlt"></button></div>
    </div>
  </section>

  <main class="stage" id="stage">
    <div class="frame">
      <button class="edge top" data-edge="top" aria-label="Top pair: change width"></button>
      <button class="edge left v" data-edge="left" aria-label="Left pair: change height"></button>
      <div class="board" id="board"></div>
      <button class="edge right v" data-edge="right" aria-label="Right pair: change height"></button>
      <button class="edge bottom" data-edge="bottom" aria-label="Bottom pair: change width"></button>
    </div>
  </main>
  <p class="hint" id="hint"></p>
</div>

<script src="core.js"></script>
<script>
(() => {
  // ---------- Model (rules live in core.js) ----------
  const { CORNERS, EDGES, LEVEL_COUNT, initial, clone, same, apply, randomEdges, levelDef, starsFor } = window.CarreauCore;
  const UNIT = 20; // percent of the board per unit
  const RUSH_TIME = 60;
  const DEFAULT_HINT = 'swipe ⇄ top / bottom half · ⇅ left / right half';

  // ---------- Storage (optional; the game works without it) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const settings = Object.assign({ sound: true, vibe: true }, store.get('carreau-settings', {}));
  const bests = Object.assign({ rush: 0, memory: 0, zen: 0 }, store.get('carreau-bests', {}));
  const stars = store.get('carreau-levels', {});

  // ---------- Sound (synthesized, no files) ----------
  const audio = {
    ctx: null,
    ensure() {
      if (!settings.sound) return null;
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();
          this.out = this.ctx.createGain();
          this.out.gain.value = .6;
          this.out.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      } catch (e) { return null; }
    },
    tone(f, at, dur, type, vol) {
      const c = this.ctx, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, at);
      g.gain.setValueAtTime(.0001, at);
      g.gain.exponentialRampToValueAtTime(vol, at + .012);
      g.gain.exponentialRampToValueAtTime(.0001, at + dur);
      o.connect(g); g.connect(this.out);
      o.start(at); o.stop(at + dur + .05);
    },
    play(name, arg) {
      const c = this.ensure();
      if (!c) return;
      const t = c.currentTime + .005;
      const arp = (notes, step, dur, type, vol) => notes.forEach((f, i) => this.tone(f, t + i * step, dur, type, vol));
      switch (name) {
        case 'move': {
          const f = { top: 392, right: 440, bottom: 330, left: 349 }[arg] || 392;
          this.tone(f, t, .09, 'triangle', .1); this.tone(f * 2, t, .05, 'sine', .03); break;
        }
        case 'match': arp([523.25, 659.25, 783.99], .055, .22, 'sine', .16); break;
        case 'perfect': arp([523.25, 659.25, 783.99, 1046.5], .05, .3, 'sine', .16); this.tone(1568, t + .2, .32, 'triangle', .05); break;
        case 'step': arp([587.33, 880], .06, .18, 'sine', .13); break;
        case 'clear': arp([523.25, 659.25, 783.99, 1046.5, 1318.5], .08, .4, 'triangle', .12); break;
        case 'fail': this.tone(220, t, .16, 'square', .045); this.tone(165, t + .13, .26, 'square', .045); break;
        case 'tick': this.tone(1200, t, .04, 'square', .035); break;
      }
    },
  };
  const HAPTICS = { match: 18, perfect: [15, 40, 25], step: 14, clear: [20, 40, 20, 40, 60], fail: [40, 30, 40] };
  // In the Capacitor app the native Haptics plugin is used (iOS has no navigator.vibrate).
  const NATIVE_HAPTICS = { match: ['impact', { style: 'LIGHT' }], step: ['impact', { style: 'LIGHT' }], perfect: ['impact', { style: 'MEDIUM' }], clear: ['notification', { type: 'SUCCESS' }], fail: ['notification', { type: 'ERROR' }] };
  function haptic(kind) {
    if (!settings.vibe) return;
    try {
      const native = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (native) { const [fn, opts] = NATIVE_HAPTICS[kind]; native[fn](opts); return; }
      if (navigator.vibrate) navigator.vibrate(HAPTICS[kind]);
    } catch (e) {}
  }

  // ---------- Rendering ----------
  const $ = id => document.getElementById(id);
  const boardEl = $('board');
  const arrowSvg = '<svg viewBox="0 0 40 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h31M29 2l6 5"/><path d="M36 17H5M11 22l-6-5"/></svg>';
  document.querySelectorAll('.edge').forEach(b => b.innerHTML = arrowSvg);

  function makePieces(el) {
    const map = {};
    CORNERS.forEach(c => { const p = document.createElement('div'); p.className = 'piece ' + c; el.appendChild(p); map[c] = p; });
    return map;
  }
  function render(pieces, s) {
    CORNERS.forEach(c => {
      pieces[c].style.width = `calc(${s[c].w * UNIT}% + 3px)`;
      pieces[c].style.height = `calc(${s[c].h * UNIT}% + 3px)`;
    });
  }
  const boardPieces = makePieces(boardEl);
  function miniBoard(s, cls) {
    const el = document.createElement('div');
    el.className = 'board mini ' + cls;
    render(makePieces(el), s);
    return el;
  }
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  const SCREENS = ['home', 'levels', 'hud', 'result'];
  function show(name) {
    SCREENS.forEach(n => { $(n).hidden = n !== name; });
    restart($(name), 'screen');
  }
  function say(text, kind) {
    const h = $('hint');
    h.textContent = text;
    h.classList.remove('say', 'bad');
    if (kind) { void h.offsetWidth; h.classList.add('say'); if (kind === 'bad') h.classList.add('bad'); }
  }
  function fireEdge(edge) { restart(document.querySelector(`.edge[data-edge="${edge}"]`), 'fire'); }

  function setStats(list) { list.forEach(([l, v], i) => { $('l' + i).textContent = l; $('v' + i).textContent = v; }); }
  function bump(i) { restart($('v' + i), 'bump'); }
  function setBar(frac, low) {
    $('bar').hidden = frac == null;
    if (frac == null) return;
    $('barfill').style.transform = `scaleX(${Math.max(0, Math.min(1, frac))})`;
    $('bar').classList.toggle('low', !!low);
  }
  function showTargets(list, cur) {
    const box = $('targets');
    box.innerHTML = '';
    const multi = list.length > 1;
    list.forEach((t, i) => {
      const cls = (multi ? 'sm ' : '') + (i < cur ? 'done ' : '') + (i === cur ? 'cur enter' : '');
      box.appendChild(miniBoard(t, cls));
    });
  }
  function setVeil(on) { const el = $('targets').querySelector('.cur'); if (el) el.classList.toggle('veil', on); }

  // ---------- Game ----------
  let state = initial();
  let G = null;

  function later(fn, ms) { const g = G; const id = setTimeout(() => { if (G === g) fn(); }, ms); if (g) g.timers.push(id); }
  function stopGame() { if (G) G.timers.forEach(clearTimeout); G = null; }

  function startGame(mode, level) {
    stopGame();
    G = { mode, timers: [], score: 0, perfect: 0, moves: 0, optimal: 0, locked: false };
    boardEl.classList.remove('win', 'miss');
    audio.ensure();
    show('hud');
    if (mode === 'rush') {
      G.time = RUSH_TIME; G.lastSec = RUSH_TIME;
      nextRound();
      G.last = performance.now();
      requestAnimationFrame(rushTick);
      say('match the target');
    } else if (mode === 'zen') {
      nextRound(); say('take your time');
    } else if (mode === 'memory') {
      G.lives = 3; nextRound();
    } else if (mode === 'level') {
      G.level = level;
      G.def = levelDef(level);
      G.ti = 0;
      state = clone(G.def.start);
      render(boardPieces, state);
      G.target = G.def.targets[0];
      showTargets(G.def.targets, 0);
      say(G.def.targets.length > 1 ? `level ${level} · ${G.def.targets.length} targets in order` : `level ${level}`);
    }
    updateHud();
  }

  function pickK() {
    const r = Math.random(), s = G.score;
    if (G.mode === 'rush') return s < 3 ? 1 + (r < .5) : s < 8 ? 2 + (r < .5) : 2 + Math.floor(r * 3);
    if (G.mode === 'memory') return Math.min(4, 1 + Math.floor(s / 3));
    return 1 + Math.floor(r * 4);
  }
  function nextRound() {
    const k = pickK();
    const t = clone(state);
    randomEdges(k).forEach(e => apply(t, e));
    G.target = t; G.optimal = k; G.moves = 0;
    showTargets([t], 0);
    if (G.mode === 'memory') memorize();
    updateHud();
  }

  function memorize() {
    G.phase = 'show'; G.locked = true;
    G.showMs = Math.max(900, 1900 - G.score * 70);
    G.showStart = performance.now();
    say('memorize it…');
    const g = G;
    (function bar() {
      if (G !== g || g.phase !== 'show') return;
      setBar(1 - (performance.now() - g.showStart) / g.showMs);
      requestAnimationFrame(bar);
    })();
    later(() => {
      G.phase = 'play'; G.locked = false;
      setVeil(true);
      say(`now rebuild it`);
      updateHud();
    }, G.showMs);
  }

  function rushTick(t) {
    if (!G || G.mode !== 'rush') return;
    const dt = Math.min(.1, (t - G.last) / 1000); // a hidden tab pauses the clock
    G.last = t;
    G.time -= dt;
    const sec = Math.ceil(G.time);
    if (sec <= 5 && sec < G.lastSec && sec > 0) audio.play('tick');
    G.lastSec = sec;
    if (G.time <= 0) { G.time = 0; updateHud(); return finish(); }
    updateHud();
    requestAnimationFrame(rushTick);
  }

  function updateHud() {
    if (!G) return;
    const m = G.mode;
    if (m === 'rush') {
      setStats([['Score', G.score], ['Perfect', G.perfect], ['Time', Math.ceil(G.time)]]);
      setBar(G.time / RUSH_TIME, G.time < 10);
      $('line').textContent = `Moves ${G.moves} · best possible ${G.optimal}`;
    } else if (m === 'zen') {
      setStats([['Matched', G.score], ['Perfect', G.perfect], ['Moves', G.moves]]);
      setBar(null);
      $('line').textContent = `Best possible ${G.optimal}`;
    } else if (m === 'memory') {
      const left = G.phase === 'show' ? G.optimal : Math.max(0, G.optimal - G.moves);
      setStats([['Score', G.score], ['Lives', '♥'.repeat(G.lives) + '♡'.repeat(3 - G.lives)], ['Moves left', left]]);
      if (G.phase !== 'show') setBar(null);
      $('line').textContent = G.phase === 'show' ? 'Remember the shape' : `Exactly ${G.optimal} move${G.optimal > 1 ? 's' : ''}`;
    } else if (m === 'level') {
      const d = G.def;
      setStats([['Level', G.level], ['Target', `${Math.min(G.ti + 1, d.targets.length)}/${d.targets.length}`], ['Moves', `${G.moves}/${d.budget}`]]);
      setBar(1 - G.moves / d.budget, d.budget - G.moves <= 1);
      $('line').textContent = d.budget === d.optimal ? `Perfect only: ${d.optimal} moves` : `★★★ in ${d.optimal} · ★★ in ${d.optimal + 2}`;
    }
  }

  function celebrate(kind) {
    restart(boardEl, 'pop');
    boardEl.classList.add('win');
    setTimeout(() => boardEl.classList.remove('win'), 380);
    audio.play(kind);
    haptic(kind);
  }
  function miss() {
    restart(boardEl, 'shake');
    boardEl.classList.add('miss');
    setTimeout(() => boardEl.classList.remove('miss'), 700);
    audio.play('fail');
    haptic('fail');
  }

  function move(edge) {
    if (G && G.locked) return;
    apply(state, edge);
    render(boardPieces, state);
    fireEdge(edge);
    audio.play('move', edge);
    if (!G) return;
    G.moves++;
    if (G.mode === 'level') levelMove();
    else if (G.mode === 'memory') memoryMove();
    else if (same(state, G.target)) roundWin();
    updateHud();
  }

  function roundWin() {
    const perfect = G.moves === G.optimal;
    G.score++; bump(0);
    if (perfect) { G.perfect++; bump(1); }
    if (G.mode === 'rush') {
      G.time = Math.min(RUSH_TIME, G.time + (perfect ? 3 : 1));
      say(perfect ? 'perfect! +3 s' : 'matched +1 s', 'good');
    } else {
      say(perfect ? 'perfect!' : 'matched', 'good');
    }
    celebrate(perfect ? 'perfect' : 'match');
    G.locked = true;
    later(() => { G.locked = false; nextRound(); }, 340);
  }

  function memoryMove() {
    if (same(state, G.target)) {
      G.score++; bump(0);
      setVeil(false);
      say('remembered!', 'good');
      celebrate('perfect');
      G.locked = true;
      later(() => { G.locked = false; nextRound(); }, 650);
    } else if (G.moves >= G.optimal) {
      G.lives--; bump(1);
      setVeil(false);
      say('not quite · that was the shape', 'bad');
      miss();
      G.locked = true;
      later(() => { if (G.lives <= 0) return finish(); G.locked = false; nextRound(); }, 1400);
    }
  }

  function levelMove() {
    const d = G.def;
    if (same(state, G.target)) {
      G.ti++;
      if (G.ti >= d.targets.length) return levelWin();
      G.target = d.targets[G.ti];
      showTargets(d.targets, G.ti);
      say(`next target · ${G.ti + 1} of ${d.targets.length}`, 'good');
      celebrate('step');
    } else if (G.moves >= d.budget) {
      say('out of moves', 'bad');
      miss();
      G.locked = true;
      later(() => finish('out'), 800);
    }
  }

  function levelWin() {
    const d = G.def, n = G.level;
    const got = starsFor(G.moves, d.optimal);
    if (got > (stars[n] || 0)) { stars[n] = got; store.set('carreau-levels', stars); }
    G.locked = true;
    say(`level ${n} cleared`, 'good');
    celebrate('clear');
    updateHud();
    later(() => finish('win', got), 750);
  }

  function finish(reason, got) {
    const g = G;
    stopGame();
    let title, text, main, alt;
    const starHtml = k => '★'.repeat(k) + `<span class="dim">${'★'.repeat(3 - k)}</span>`;
    $('resStars').hidden = g.mode !== 'level' || reason !== 'win';
    if (g.mode === 'rush' || g.mode === 'memory') {
      const isBest = g.score > bests[g.mode];
      if (isBest) { bests[g.mode] = g.score; store.set('carreau-bests', bests); }
      title = isBest ? 'New best!' : g.mode === 'rush' ? "Time's up." : 'Out of lives.';
      text = g.mode === 'rush'
        ? `${g.score} shapes matched, ${g.perfect} of them in the fewest moves. Best: ${bests.rush}.`
        : `${g.score} shapes rebuilt from memory. Best: ${bests.memory}.`;
      main = ['Play again', () => startGame(g.mode)];
      alt = ['Modes', goHome];
    } else if (reason === 'win') {
      title = `Level ${g.level} cleared`;
      $('resStars').innerHTML = starHtml(got);
      text = `${g.moves} moves. The fewest possible is ${g.def.optimal}.`;
      main = g.level < LEVEL_COUNT ? ['Next level', () => startGame('level', g.level + 1)] : ['All levels', openLevels];
      alt = got < 3 ? ['Retry', () => startGame('level', g.level)] : ['Levels', openLevels];
    } else {
      title = 'Out of moves.';
      text = `Level ${g.level} can be done in ${g.def.optimal} move${g.def.optimal > 1 ? 's' : ''}. You have ${g.def.budget}.`;
      main = ['Retry', () => startGame('level', g.level)];
      alt = ['Levels', openLevels];
    }
    $('resTitle').textContent = title;
    $('resText').textContent = text;
    $('resMain').textContent = main[0]; $('resMain').onclick = main[1];
    $('resAlt').textContent = alt[0]; $('resAlt').onclick = alt[1];
    show('result');
    $('resMain').focus({ preventScroll: true });
  }

  function quit() {
    if (G && G.mode === 'zen' && G.score > bests.zen) { bests.zen = G.score; store.set('carreau-bests', bests); }
    if (G && G.mode === 'level') { openLevels(); return; }
    goHome();
  }

  // ---------- Menus ----------
  function totalStars() { return Object.values(stars).reduce((a, b) => a + b, 0); }
  function goHome() {
    stopGame();
    $('bestRush').textContent = bests.rush ? `Best ${bests.rush}` : 'New';
    $('bestLevels').textContent = `★ ${totalStars()} / ${LEVEL_COUNT * 3}`;
    $('bestMemory').textContent = bests.memory ? `Best ${bests.memory}` : 'New';
    $('bestZen').textContent = bests.zen ? `Best run ${bests.zen}` : 'New';
    show('home');
    say(DEFAULT_HINT);
  }
  function openLevels() {
    stopGame();
    const grid = $('lvlGrid');
    grid.innerHTML = '';
    for (let n = 1; n <= LEVEL_COUNT; n++) {
      const b = document.createElement('button');
      b.className = 'lvl';
      b.disabled = n > 1 && !stars[n - 1];
      const s = stars[n] || 0;
      b.innerHTML = `${n}<small>${'★'.repeat(s)}</small>`;
      b.setAttribute('aria-label', `Level ${n}${b.disabled ? ', locked' : s ? `, ${s} stars` : ''}`);
      b.addEventListener('click', () => startGame('level', n));
      grid.appendChild(b);
    }
    $('starTotal').textContent = `★ ${totalStars()} / ${LEVEL_COUNT * 3}`;
    show('levels');
    say('clear a level to unlock the next');
  }

  document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
    audio.ensure();
    const m = b.dataset.mode;
    if (m === 'levels') openLevels(); else startGame(m);
  }));
  document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));
  $('quit').addEventListener('click', quit);

  // ---------- Settings ----------
  function syncToggles() {
    $('soundBtn').setAttribute('aria-pressed', settings.sound);
    $('vibeBtn').setAttribute('aria-pressed', settings.vibe);
    $('soundBtn').setAttribute('aria-label', settings.sound ? 'Sound on' : 'Sound off');
    $('vibeBtn').setAttribute('aria-label', settings.vibe ? 'Vibration on' : 'Vibration off');
  }
  $('soundBtn').addEventListener('click', () => {
    settings.sound = !settings.sound; store.set('carreau-settings', settings); syncToggles();
    if (settings.sound) audio.play('match');
  });
  $('vibeBtn').addEventListener('click', () => {
    settings.vibe = !settings.vibe; store.set('carreau-settings', settings); syncToggles();
    haptic('match');
  });

  // ---------- Input ----------
  document.querySelectorAll('.edge').forEach(b => b.addEventListener('click', () => move(b.dataset.edge)));

  // Swipes fire as soon as the finger has travelled far enough, not on release.
  // Direction picks width vs height; the half of the board where the swipe starts picks the pair.
  const stage = $('stage');
  let down = null;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('.edge')) return;
    down = { x: e.clientX, y: e.clientY, done: false };
  });
  window.addEventListener('pointermove', e => {
    if (!down || down.done) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    down.done = true;
    const r = boardEl.getBoundingClientRect();
    if (Math.abs(dx) > Math.abs(dy)) move(down.y < r.top + r.height / 2 ? 'top' : 'bottom');
    else move(down.x < r.left + r.width / 2 ? 'left' : 'right');
  });
  const lift = () => { down = null; };
  window.addEventListener('pointerup', lift);
  window.addEventListener('pointercancel', lift);

  // Keyboard: the arrow pointing at an edge works that edge (also W A S D). Esc quits.
  const KEYS = { arrowup: 'top', w: 'top', arrowdown: 'bottom', s: 'bottom', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
  window.addEventListener('keydown', e => {
    const edge = KEYS[e.key.toLowerCase()];
    if (edge) { e.preventDefault(); move(edge); }
    else if (e.key === 'Escape' && G) quit();
  });

  syncToggles();
  render(boardPieces, state);
  goHome();

  // Offline support on the web (the Capacitor app already ships its files).
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.Capacitor) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
